name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: M4 hardening isolation checks
        run: timeout --signal=TERM --kill-after=5s 75s node --experimental-strip-types --test tests/m4-hardening.test.ts
      - name: Unit tests
        run: timeout --signal=TERM --kill-after=5s 180s npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
