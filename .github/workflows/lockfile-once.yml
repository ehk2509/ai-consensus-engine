name: Generate reproducible lockfiles (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/lockfile-once.yml
permissions:
  contents: write
jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m2-debate-engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit both milestone lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for branch in feat/m1-foundation feat/m2-debate-engine; do
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git add package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: lock npm dependencies for reproducible installs"
              git push origin "HEAD:$branch"
            fi
          done
